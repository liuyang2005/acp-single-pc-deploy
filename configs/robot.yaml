network:
  inference_endpoint: tcp://127.0.0.1:5555
  timeout_s: 10.0

robot:
  serial: Rizon4s-063586
  tool: hapticexoteleop
  clear_fault: false
  enable_timeout_s: 30.0
  home_joints_deg: [0, -32, 0, 90, 0, 28, 45]
  home_timeout_s: 60.0
  home_epsilon_deg: 0.5
  home_joint_max_velocity_rad_s: 0.25
  home_joint_max_acceleration_rad_s2: 0.60

camera:
  serial: "260322274925"
  dataset_name: cam_260322274925_wrist
  width: 640
  height: 480
  fps: 30
  frame_timeout_ms: 15000
  start_attempts: 2
  retry_delay_s: 1.0
  start_timeout_s: 35.0
  color_order: RGB
  policy_width: 224
  policy_height: 224

acquisition:
  robot_state_hz: 500
  buffer_capacity: 4096
  warmup_timeout_s: 8.0
  baseline_duration_s: 2.0
  baseline_sample_period_s: 0.005

execution:
  execute_points: 12
  control_period_s: 0.005
  inner_translation_stiffness_n_m: 5000.0
  inner_rotation_stiffness_nm_rad: 100.0
  max_contact_wrench: [25.0, 25.0, 25.0, 2.0, 2.0, 2.0]
  max_linear_velocity_m_s: 0.02
  max_linear_acceleration_m_s2: 0.05
  max_angular_velocity_rad_s: 0.05
  max_angular_acceleration_rad_s2: 0.05

safety:
  max_raw_force_norm_n: 25.0
  max_raw_torque_norm_nm: 2.0
  max_delta_force_norm_n: 20.0
  max_delta_torque_norm_nm: 1.0
  stiffness_min_n_m: 200.0
  stiffness_max_n_m: 5000.0
  max_translation_step_m: 0.002
  max_rotation_step_rad: 0.035
  max_workspace_radius_m: 0.08
  max_rgb_age_s: 0.20
  max_pose_age_s: 0.05
  max_wrench_age_s: 0.05

logging:
  root: acp_single_pc_deploy/logs/robot
  dry_run_frame_interval_s: 1.0
